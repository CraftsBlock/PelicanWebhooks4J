plugins {
    id "java"
    id "de.craftsblock.gradle.publish" version "0.0.21"
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21

    withJavadocJar()
    withSourcesJar()
}

group = 'de.craftsblock.pelican'
version = '0.1.0'

repositories {
    mavenCentral()

    maven {
        name "craftsblockReleases"
        url "https://repo.craftsblock.de/releases"
    }
}

dependencies {
    // CraftsBlock related --------------------------------------------------------------------------------

    // https://repo.craftsblock.de/#/releases/de/craftsblock/craftscore/bom
    implementation platform("de.craftsblock.craftscore:bom:3.8.20")

    // https://repo.craftsblock.de/#/releases/de/craftsblock/craftscore/event
    implementation "de.craftsblock.craftscore:event"

    // Third party ----------------------------------------------------------------------------------------

    // https://mvnrepository.com/artifact/org.jetbrains/annotations
    implementation "org.jetbrains:annotations:26.1.0"

    // https://mvnrepository.com/artifact/com.google.code.gson/gson
    implementation "com.google.code.gson:gson:2.14.0"
}

craftsPublish {
    artifactId = "pelicanwebhooks4j"
    name = "PelicanWebhooks4J"

    component = project.components.java

    pom {
        name = "PelicanWebhooks4J"
        description = "Simple parser and event system for webhooks from the pelican panel"

        scm {
            url = "https://github.com/CraftsBlock/PelicanWebhooks4J"
            connection = "scm:git:git://github.com/CraftsBlock/PelicanWebhooks4J.git"
            developerConnection = "scm:git:git@github.com:CraftsBlock/PelicanWebhooks4J.git"
        }

        issueManagement {
            system = "github"
            url = "https://github.com/CraftsBlock/PelicanWebhooks4J/issues"
        }

        licenses {
            license {
                name = "GNU General Public License v3.0"
                url = "https://github.com/CraftsBlock/PelicanWebhooks4J/blob/develop/LICENSE"
            }
        }
    }
}
